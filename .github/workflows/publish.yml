name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run full pipeline
        run: pnpm run ready

      - name: Determine changed packages
        id: changes
        run: |
          DIFF_RANGE="${{ github.event.before }}..${{ github.sha }}"

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            DIFF_RANGE="HEAD~1..HEAD"
          fi

          if git diff --name-only $DIFF_RANGE | grep -q "^packages/di/"; then
            echo "di=true" >> $GITHUB_OUTPUT
          else
            echo "di=false" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only $DIFF_RANGE | grep -q "^packages/di-hono/"; then
            echo "di-hono=true" >> $GITHUB_OUTPUT
          else
            echo "di-hono=false" >> $GITHUB_OUTPUT
          fi

          if git diff --name-only $DIFF_RANGE | grep -q "^packages/di-orpc/"; then
            echo "di-orpc=true" >> $GITHUB_OUTPUT
          else
            echo "di-orpc=false" >> $GITHUB_OUTPUT
          fi

      - name: Release @ultranomic/di
        if: steps.changes.outputs.di == 'true'
        working-directory: packages/di
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release @ultranomic/di-hono
        if: steps.changes.outputs.di-hono == 'true'
        working-directory: packages/di-hono
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Release @ultranomic/di-orpc
        if: steps.changes.outputs.di-orpc == 'true'
        working-directory: packages/di-orpc
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
